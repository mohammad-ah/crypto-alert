name: Concretum Noise + VWAP 30m Signal Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [scan]
  schedule:
    # Keep GitHub's clock as a backup. It has never created a run in this repo.
    - cron: '12,42 * * * *'

permissions:
  contents: write
  actions: write

jobs:
  scan_concretum_signals:
    runs-on: ubuntu-latest
    concurrency:
      group: concretum-scan
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 30-Minute Concretum Noise + VWAP Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST || 'SPY,QQQ,BITO,NVDA,TSLA,BTC-USD,ETH-USD' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '100000' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '14' }}
          VOL_MULT: ${{ vars.VOL_MULT || '1.0' }}
          USER_BIAS: ${{ vars.USER_BIAS || 'Both (Long & Short)' }}
          USE_COMPLETED_DECISION_BAR: ${{ vars.USE_COMPLETED_DECISION_BAR || 'false' }}
        run: python scanner_cron.py --send-alerts

      - name: Save deduplication state
        run: |
          git config user.name "concretum-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/last_alerts.json || true
          git diff --staged --quiet || git commit -m "chore: update 30m signal state"
          git push || true

  # GitHub's schedule event has never fired here. After you click Run workflow once,
  # this job waits ~28 minutes and starts the next run itself.
  queue_next_scan:
    needs: scan_concretum_signals
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: concretum-chain
      cancel-in-progress: true
    steps:
      - name: Wait 28 minutes then start the next scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 1680
          gh workflow run concretum_scanner.yml --ref "${{ github.event.repository.default_branch }}"
