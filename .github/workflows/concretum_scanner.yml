name: Concretum Noise + VWAP 30m Signal Scanner

on:
  workflow_dispatch:
  schedule:
    # UTC. Offset from :00/:30 so GitHub is less likely to delay or drop the run.
    # A push of this file is also what re-registers a stuck schedule.
    - cron: '7,37 * * * *'

jobs:
  scan_concretum_signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: concretum-scanner
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 30-Minute Concretum Noise + VWAP Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST || 'SPY,QQQ,BITO,NVDA,TSLA,BTC-USD,ETH-USD' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '100000' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '14' }}
          VOL_MULT: ${{ vars.VOL_MULT || '1.0' }}
          USER_BIAS: ${{ vars.USER_BIAS || 'Both (Long & Short)' }}
          USE_COMPLETED_DECISION_BAR: ${{ vars.USE_COMPLETED_DECISION_BAR || 'false' }}
        run: python scanner_cron.py --send-alerts

      - name: Save deduplication state
        run: |
          git config user.name "concretum-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/last_alerts.json || true
          git diff --staged --quiet || git commit -m "chore: update 30m signal state"
          git push || true
